version: "3"
services:
  ml:
    build:
      context: MedicalRAG/
      dockerfile: Dockerfile
    env_file:
      - ./.docker/.env
    environment:
      DEV_MODE: "${DEV_MODE:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      TEXT_MODEL_NAME: "${TEXT_MODEL_NAME:-Henrychur/MMedLM2}"
      IMAGE_MODEL_NAME: "${IMAGE_MODEL_NAME:-google/medsiglip-448}"
      HF_TOKEN: "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"
      TEXT_MAX_LENGTH: "${TEXT_MAX_LENGTH:-1024}"
      TORCH_DEVICE: "${TORCH_DEVICE:-cpu}"
      QDRANT_HOST: "${QDRANT_HOST:-qdrant}"
      QDRANT_PORT: "${QDRANT_PORT:-6333}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-medical_cases}"
      QDRANT_DISTANCE: "${QDRANT_DISTANCE:-cosine}"
      QDRANT_IMAGE_WEIGHT: "${QDRANT_IMAGE_WEIGHT:-0.4}"
      RETRIEVAL_TOP_K: "${RETRIEVAL_TOP_K:-5}"
      DATABASE_DSN: "${DATABASE_DSN:-postgresql+asyncpg://postgres:postgres@postgres:5432/medical}"
      DATABASE_ECHO: "${DATABASE_ECHO:-false}"
      S3_BUCKET: "${S3_BUCKET:-medical-cases}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-http://s3:9000}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
      S3_USE_SSL: "${S3_USE_SSL:-false}"
    ports:
      - "8000:8000"
    volumes:
      - hf_models:/models

  qdrant:
    image: qdrant/qdrant:v1.8.4
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "python -m alembic upgrade head && python -m uvicorn app:app --host 0.0.0.0 --port 8000"

  postgres:
    image: postgres:latest
    container_name: db
    volumes:
      - postgres_storage:/var/lib/postgresql/data
      - ./.docker/initdb:/docker-entrypoint-initdb.d
    env_file:
      - .docker/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    command:
      sh -c "npm run build"
    volumes:
      - frontend_storage:/app/dist   

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: unless-stopped
    volumes:
      - static_storage:/data
    env_file:
      - .docker/.env
    command: server /data --console-address :9001
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
  
  nginx:
    build:
      dockerfile: ./Dockerfile
      context: ./.docker/nginx/
    container_name: nginx
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - frontend_storage:/usr/share/nginx/html
    env_file:
      - .docker/.env
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres_storage:
  static_storage:
  hf_models:
  qdrant_data:
  frontend_storage:
